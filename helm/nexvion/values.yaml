replicaCount: 2

image:
  repository: nexvion-ecommerce
  tag: "1.0"
  pullPolicy: Never

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30087

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

probes:
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20
serviceAccount:
  create: false
  automount: false

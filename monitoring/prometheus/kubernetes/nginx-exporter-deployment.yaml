apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: nexvion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          imagePullPolicy: Never
          args:
            - --nginx.scrape-uri=http://nginx-monitor:8080/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-monitor
  namespace: nexvion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-monitor
  template:
    metadata:
      labels:
        app: nginx-monitor
    spec:
      containers:
        - name: nginx
          image: nexvion-nginx-monitor:1.0
          imagePullPolicy: Never
          ports:
            - name: status
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

services:
  nexvion-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: nexvion-ecommerce:1.0
    container_name: nexvion-web

    ports:
      - "8086:80"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - nexvion-network

networks:
  nexvion-network:
    driver: bridge
